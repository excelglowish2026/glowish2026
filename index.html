<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Glowish Tracker</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="login-wrap">
    <form class="book" id="login-form" autocomplete="off">
      <div class="book-corner tl"></div>
      <div class="book-corner br"></div>

      <img src="img/logo.png" alt="Glowish Tracker" class="book-logo" />
      <p class="book-eyebrow">Luzon &middot; Visayas &middot; Mindanao</p>
      <h1 class="book-title">Glowish Tracker</h1>
      <p class="book-subtitle">Sign in with your branch credentials to open your store's records.</p>

      <div class="form-warning" id="config-warning" hidden>
        This site isn’t connected to a spreadsheet yet. Set <code>API_URL</code> in <code>js/config.js</code>.
      </div>

      <div class="form-error" id="login-error" hidden></div>

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn-primary" id="login-submit">Login</button>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
